owner: tzx1z
repo: status

sites:
  - name: XMPP клиенты (5222)
    check: "tcp"
    url: xmpp.inkov.dev
    port: 5222
    body: "<?xml version='1.0'?><stream:stream to='inkov.dev' xmlns='jabber:client' xmlns:stream='http://etherx.jabber.org/streams' version='1.0'>"
    __dangerous__body_down_if_text_missing: "<starttls"
  - name: XMPP федерация (5269)
    check: "tcp"
    url: xmpp.inkov.dev
    port: 5269
    body: "<?xml version='1.0'?><stream:stream to='inkov.dev' xmlns='jabber:server' xmlns:stream='http://etherx.jabber.org/streams' version='1.0'>"
    __dangerous__body_down_if_text_missing: "<starttls"
  # проходит через HAProxy на 443, TLS и HTTP-модуль Prosody
  - name: XMPP WebSocket
    url: https://xmpp.inkov.dev/xmpp-websocket
    __dangerous__body_down_if_text_missing: "Prosody WebSocket endpoint"
  # только TCP до HAProxy: TLS и Prosody за ним эта проверка не видит
  - name: XMPP клиенты TLS (443)
    check: "tcp-ping"
    url: xmpp.inkov.dev
    port: 443

status-website:
  cname: status.inkov.dev
  name: inkov.dev status
